name: Roll back production

on:
  workflow_dispatch:
    inputs:
      immutable_ref:
        description: Previous image digest or immutable release reference
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  rollback:
    environment: production
    runs-on: [self-hosted, prod-deployer]
    timeout-minutes: 30
    env:
      ROLLBACK_REF: ${{ inputs.immutable_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: ./ci/run rollback-production
