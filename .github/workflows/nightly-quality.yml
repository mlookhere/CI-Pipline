name: Nightly deep quality
on:
  schedule:
    - cron: '31 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly-deep-quality
  cancel-in-progress: true
jobs:
  deep-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/requirements-ci.txt
      - run: ./scripts/bootstrap --ci
      - run: ./ci/run release
      - name: Optional mutation/property/flaky-test stages
        run: ./ci/run nightly
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-quality-${{ github.run_id }}
          path: artifacts/ci/
          retention-days: 30
