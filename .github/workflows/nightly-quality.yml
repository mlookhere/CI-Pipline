name: Nightly deep quality
on:
  schedule:
    - cron: '31 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly-deep-quality
  cancel-in-progress: true
jobs:
  deep-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/requirements-ci.txt
      - run: ./scripts/bootstrap --ci
      - run: ./ci/run release
      - name: Optional mutation/property/flaky-test stages
        run: ./ci/run nightly
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-quality-${{ github.run_id }}
          path: artifacts/ci/
          retention-days: 30
