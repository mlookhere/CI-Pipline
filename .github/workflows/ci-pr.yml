name: PR CI

on:
  merge_group:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: true

env:
  CI: "true"
  CI_BASE_REF: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}

jobs:
  metadata:
    name: PR metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate Issue link, branch, and risk labels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 workflow/validate_pr.py
      - name: Merge queue metadata already validated by source PR
        if: github.event_name == 'merge_group'
        run: echo "Metadata is enforced on the pull request before it enters the merge queue."

  fast:
    name: Fast deterministic gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ci/requirements-ci.txt
      - run: ./scripts/bootstrap --ci
      - run: ./ci/run fast
      - name: Upload deterministic gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-ci-${{ github.run_id }}
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 14

  typed-advisory:
    # Reports, never blocks. The fast gate type-checks with `no_site_packages = true` so
    # it stays reproducible, which means every finding that depends on a third party's
    # signatures is invisible there. This job pays that back by checking with those types
    # available -- and it must not gate, because a new chromadb or pydantic release could
    # add findings without a line of this repository changing, and a gate that goes red
    # for that teaches people to ignore it (Issue #24).
    #
    # Non-blocking by construction, not by `continue-on-error` and not by `|| true`:
    # `workflow/typed_advisory.py` prints the findings, writes them to the artifact,
    # raises them as annotations, and exits 0 deliberately. A shell fallback would make
    # `ci/run.py` record a clean run it never had, losing the count and the findings.
    name: Typed findings (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ci/requirements-ci.txt
      - run: ./scripts/bootstrap --ci
      - run: ./ci/run typed-advisory
      - name: Upload typed findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typed-advisory-${{ github.run_id }}
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 14

  audit:
    # A separate job rather than a step inside the gates above. pip-audit resolves the
    # full transitive set into an isolated environment, which takes about as long as the
    # rest of the PR gate put together, so running it alongside keeps the wall clock flat.
    # It also gives a dependency finding its own named check, instead of a test-and-build
    # failure that has to be opened to understand.
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ci/requirements-ci.txt
      - run: ./scripts/bootstrap --ci
      - run: ./ci/run audit
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-ci-${{ github.run_id }}
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 14

  pr-tests:
    name: PR test/build gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ci/requirements-ci.txt
      - run: ./scripts/bootstrap --ci
      - run: ./ci/run pr
      - name: Upload PR gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-ci-${{ github.run_id }}
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 14
