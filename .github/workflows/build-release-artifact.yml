name: Build and attest release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: vars.ENABLE_RELEASE_ARTIFACT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ci/requirements-ci.txt
      - run: ./scripts/bootstrap --ci
      - name: Build exact release artifacts and SBOM
        run: ./ci/run release-artifact
      - name: Create deterministic release manifest
        run: python3 workflow/release_manifest.py create --root artifacts/release --commit "$GITHUB_SHA"
      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: artifacts/release/**
      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
