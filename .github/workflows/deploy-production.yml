name: Deploy production

on:
  workflow_run:
    workflows: ["Build and attest release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Build and attest release workflow run ID
        required: true
        type: string
      release_sha:
        description: Exact protected production commit SHA from that run
        required: true
        type: string

permissions: {}

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.ENABLE_PRODUCTION_DEPLOY == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master'))
    environment: production
    runs-on: [self-hosted, prod-deployer]
    timeout-minutes: 45
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      RELEASE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.release_run_id || github.event.workflow_run.id }}
      RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.event.workflow_run.head_sha }}
      RELEASE_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/release
    steps:
      - name: Check out only the attested protected commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Download exact release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-${{ env.RELEASE_SHA }}
          path: artifacts/release
          run-id: ${{ env.RELEASE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Require the current protected production tip
        run: |
          git fetch --no-tags origin master
          test "$(git rev-parse origin/master)" = "$RELEASE_SHA"
      - name: Verify release manifest and file digests
        run: python3 workflow/release_manifest.py verify --root artifacts/release --commit "$RELEASE_SHA"
      - name: Verify artifact attestations and trusted builder identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r -d '' artifact; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-release-artifact.yml" \
              --source-digest "$RELEASE_SHA" \
              --source-ref "refs/heads/master" \
              --deny-self-hosted-runners
          done < <(find artifacts/release -type f -print0)
      - name: Deploy only the verified bundle
        run: ./ci/run deploy-production
