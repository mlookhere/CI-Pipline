name: Sync control issue

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  pull_request_target:
    # Lifecycle only. `labeled`, `unlabeled` and `synchronize` were here and could not change
    # what this workflow renders: `open_issues_and_prs` reads a pull request's number, title,
    # headRefName, baseRefName, url and statusCheckRollup, and never its labels, while check
    # status arrives accurately through the `workflow_run` trigger below rather than on push.
    # What they did do was fire three events in three seconds every time `./flow pr` created a
    # pull request and then added its risk labels, so the first two runs were cancelled by the
    # third -- and a cancelled run is reported as a failed check (Issue #24).
    types: [opened, reopened, closed, ready_for_review, converted_to_draft]
  workflow_run:
    # Only the workflows this repository actually has. A name here that matches nothing
    # never fires, so a stale entry is a trigger that silently does not exist.
    workflows: ["PR CI", "Release gate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

# Deliberately no workflow-level concurrency. One group here would cover every
# trigger, which is what let a `workflow_run` completing in the same second
# cancel a merge's one-shot closure handler (Issue #36). Each job below declares
# the group that suits its own idempotence instead.

jobs:
  close:
    # A one-shot edge handler for an event that will never fire again. Losing this
    # run leaves the controlling Issue claiming the work is still active after it
    # has shipped, and a cancelled run is indistinguishable from a benign one.
    #
    # Keyed on the pull request, so no other pull request and no other trigger can
    # contend for this group. Within one pull request a close/reopen/close sequence
    # can still supersede a queued run -- GitHub cancels a previously *pending* run
    # in a group even under cancel-in-progress: false -- but that is benign here,
    # because the surviving run is the later event and carries the later state.
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: control-issue-close-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Check out only the protected default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Update controlling Issue after PR closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 workflow/handle_pr_state.py

  sync:
    # Idempotent: it recomputes the pinned control Issue from current state, so
    # discarding a redundant run during a burst of pushes costs nothing.
    #
    # `needs: close` restores the ordering the single-job version got for free.
    # sync_control renders the control block from every open Issue's state labels,
    # so running it before the closure handler has moved this PR's Issue would
    # publish a control body listing shipped work as still active. `!cancelled()`
    # rather than `success()`: close is skipped on every non-closure event and may
    # fail on its own, and neither is a reason to leave the control Issue stale.
    needs: close
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # Per trigger, not one group for the whole job. Only a `pull_request_target` run is
      # reported as a check on a pull request, and a global group let the other triggers
      # cancel it: `./flow pr` creates the pull request, then labels the controlling Issue,
      # then rewrites the control Issue body, so two `issues` events land within a second of
      # the `pull_request_target` one and cancelled it. Trimming the pull-request event types
      # did not help, because the events doing the cancelling were never pull-request events
      # (Issue #24). Runs of the same trigger still supersede each other, which is what
      # idempotence buys.
      group: control-issue-sync-${{ github.event_name }}
      cancel-in-progress: true
    steps:
      - name: Check out only the protected default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Synchronize the pinned control Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 workflow/claude_flow.py sync-control
