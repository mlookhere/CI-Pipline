version: 2
updates:
# target-branch is mandatory on every ecosystem. Without it Dependabot opens
# PRs against the repository default branch, which skips the PR gate entirely --
# ci-pr.yml only triggers on `pull_request: branches: [dev]` -- and would land
# dependency changes on production without ever passing through integration.
# See workflow/check_workflow_policy.py, which enforces it.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "type:maintenance"
      - "risk:dependencies"
      - "risk:ci"
# The only Python manifest here is the CI tooling, and it lives in ci/ rather than
# at the root. Pointed at "/" this ecosystem would find nothing and report nothing,
# which reads exactly like a repository with no outdated dependencies.
  - package-ecosystem: "pip"
    directory: "/ci"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "type:maintenance"
      - "risk:dependencies"
