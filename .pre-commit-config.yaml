minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: claude-quality-staged
        name: Deterministic staged-file gates
        entry: ./ci/run quality-staged
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: claude-workflow-policy
        name: Workflow and hook policy
        entry: ./scripts/validate-workflow
        language: system
        pass_filenames: false
        files: ^(?:\.claude/|\.github/workflows/|workflow/|ci/|scripts/|\.claude-workflow\.json)
        stages: [pre-commit]

      - id: claude-fast-pre-push
        name: Fast pre-push gates
        entry: ./ci/run fast
        language: system
        pass_filenames: false
        stages: [pre-push]
