# The typed check the fast gate cannot run.
#
# `pyproject.toml` sets `no_site_packages = true` for a stated reason: numpy >= 2.3 ships
# inline stubs written with PEP 695 `type` statements, which are a fatal parse error under
# `python_version = 3.10`, and mypy stops checking everything else. That keeps the gate
# reproducible, and the cost is that our own code is checked against no third-party types
# at all -- so every finding that depends on chromadb's, fastapi's or pydantic's signatures
# is invisible on the gate that runs every day.
#
# This config pays that cost back without moving it onto the blocking gate: third-party
# types available, at a Python version whose stubs actually parse. It runs non-blocking, so
# a new third-party release cannot turn an unrelated pull request red -- and so the
# trade-off stays visible instead of decaying into permanently hidden errors (Issue #24).
#
# Deliberately NOT a copy of the strict settings in pyproject.toml. The point is the extra
# information third-party types provide, not a second opinion on our own strictness.

[mypy]
files = knowledge_nexus, ci, workflow, tests
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
no_implicit_optional = True
