# The typed check a hermetic fast gate cannot run.
#
# `pyproject.toml` sets `no_site_packages = true` for a stated reason: a third-party release
# shipping inline stubs written for a newer Python is a fatal parse error under an older
# `python_version`, and mypy stops checking everything else. That keeps the gate
# reproducible, and the cost is that the code is checked against no third-party types at
# all -- so every finding that depends on a dependency's signatures is invisible on the gate
# that runs every day.
#
# This config pays that cost back without moving it onto the blocking gate: third-party
# types available, at a Python version whose stubs actually parse. It runs non-blocking, so
# a new third-party release cannot turn an unrelated pull request red -- and so the
# trade-off stays visible instead of decaying into permanently hidden errors.
#
# Deliberately NOT a copy of the strict settings in pyproject.toml. The point is the extra
# information third-party types provide, not a second opinion on our own strictness.
#
# No stage here runs it. The control plane has no third-party runtime dependencies, so
# `workflow/typed_advisory.py` has nothing to witness and exits non-zero rather than report
# a check it did not perform. Both ship for consumers that do have them: set
# `project.typed_advisory_witness`, add `typed_advisory` to a stage, and widen `files` below
# to include the package.

[mypy]
files = workflow, ci, tests
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
no_implicit_optional = True
